function showModal(title,message,confirm='Delete'){return new Promise(resolve=>{const root=$('#overlay'),okay=$('#modalOkay'),cancel=$('#modalCancel');$('#modalTitle').textContent=title;$('#modalMessage').textContent=message;okay.textContent=confirm;okay.classList.toggle('danger',confirm==='Delete');root.classList.remove('hidden');okay.focus();function done(x){root.classList.add('hidden');okay.removeEventListener('click',yes);cancel.removeEventListener('click',no);document.removeEventListener('keydown',escKey);resolve(x)}function yes(){done(true)}function no(){done(false)}function escKey(e){if(e.key==='Escape')no()}okay.addEventListener('click',yes);cancel.addEventListener('click',no);document.addEventListener('keydown',escKey)})}

async function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('IndexedDB unavailable'));let req=indexedDB.open('NSNP_Quotation_Store',3);req.onupgradeneeded=e=>{let d=req.result;if(!d.objectStoreNames.contains('quotes')){let s=d.createObjectStore('quotes',{keyPath:'id'});s.createIndex('refNo','refNo',{unique:true})}if(!d.objectStoreNames.contains('clients'))d.createObjectStore('clients',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});if(!d.objectStoreNames.contains('pdfs'))d.createObjectStore('pdfs',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

const FALLBACK_KEY='NSNP_Local_Store_v1';
function readFallback(){try{return JSON.parse(localStorage.getItem(FALLBACK_KEY)||'{}')}catch(e){throw Error('Local browser storage is unavailable')}}
function writeFallback(value){localStorage.setItem(FALLBACK_KEY,JSON.stringify(value))}
function pdfToBlob(row){if(row?.pdfBase64){let bytes=binaryFromDataUrl('data:application/pdf;base64,'+row.pdfBase64);let copy={...row,pdf:new Blob([bytes],{type:'application/pdf'})};delete copy.pdfBase64;return copy}return row}
async function allOf(store){if(fallback)return Object.values(readFallback()[store]||{}).map(x=>store==='pdfs'?pdfToBlob(x):x);return request(db.transaction(store,'readonly').objectStore(store).getAll())}
async function readOne(store,key){if(fallback){let x=(readFallback()[store]||{})[key];return store==='pdfs'?pdfToBlob(x):x}return request(db.transaction(store,'readonly').objectStore(store).get(key))}
async function putOne(store,val){if(fallback){let records=readFallback();records[store]=records[store]||{};let copy={...val};if(store==='pdfs'&&copy.pdf){let bytes=new Uint8Array(await copy.pdf.arrayBuffer()),binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));copy.pdfBase64=btoa(binary);delete copy.pdf}records[store][copy.id||copy.key]=copy;writeFallback(records);return}let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);await txDone(tx)}
async function deleteOne(store,key){if(fallback){let records=readFallback();if(records[store])delete records[store][key];writeFallback(records);return}let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);await txDone(tx)}

 case'fields':el.innerHTML=`<div class="panel-head"><h2>Custom quotation fields</h2><button class="btn small" id="newCustom">${icon('plus')} Add Field</button></div><p class="small-note">Additional fields appear in the form and can be placed in the PDF terms or notes section.</p><div id="customEditor"></div><div id="customList"></div>`;$('#newCustom').onclick=()=>showCustomEditor();renderCustomList();break;
 case'reference':el.innerHTML=`<h2 style="margin-top:0">Reference number settings</h2><p class="small-note">New references use the format NSNP/QUO/YYYY/NNN. Existing quotations are not renumbered.</p><div class="grid2">${labelField('s_prefix','Reference Prefix',c.prefix)}${labelField('s_nextNo','Preferred Next Number',c.nextNo,'number','min="1" step="1"')}</div><label class="item-conditional"><input id="s_annualReset" type="checkbox" ${c.annualReset?'checked':''}> Reset sequence when quotation year changes</label><div style="margin-top:20px"><button class="btn" id="saveReferences">Save Reference Settings</button></div>`;$('#saveReferences').onclick=async()=>{let next=Math.floor(safeNumber($('#s_nextNo').value)),prefix=getText('#s_prefix').replace(/\/$/,'');if(!next||!prefix||prefix.includes(' '))return toast('Enter a valid prefix and starting number.',true);company.prefix=prefix;company.nextNo=next;company.annualReset=$('#s_annualReset').checked;let meta=await readOne('meta','reference');if(meta){meta.next=Math.max(next,meta.next||1);await putOne('meta',meta)}else await putOne('meta',{key:'reference',next,year:new Date().getFullYear(),used:[]});await saveCompany();toast('Reference Settings Updated')};break;
 case'backup':el.innerHTML=`<h2 style="margin-top:0">Backup and restore</h2><div class="alert">Quotations are stored in this browser on this device. They do not automatically synchronise to other devices. Export a backup regularly.</div><div class="grid2"><div><h3>Export all data</h3><p class="small-note">Download a JSON backup containing quotations, clients, settings and issued PDF files.</p><button class="btn" id="exportBackup">${icon('download')} Export Backup</button></div><div><h3>Restore backup</h3><p class="small-note">Import an NSNP backup file. Existing data may be replaced after confirmation.</p><input type="file" id="importBackup" accept="application/json,.json" class="input"></div></div><hr class="hr"><p class="small-note">Keep backup files secure because they contain client information and company signature images.</p>`;$('#exportBackup').onclick=exportBackup;$('#importBackup').onchange=importBackup;break}}
async function saveCompany(){await putOne('settings',{key:'main',data:company});$$('.logo-img').forEach(im=>im.src=company.logo||ASSET.logo)}
async function handleUpload(e,key){let file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Please select a PNG, JPG or WebP image.',true);if(file.size>5*1024*1024)return toast('Please use an image under 5 MB.',true);let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});if(!(await showModal('Replace image?',`Replace the existing ${key} with the selected image?`,'Replace')))return;company[key]=data;await saveCompany();$('#preview_'+key).src=data;toast(key[0].toUpperCase()+key.slice(1)+' Updated')}
function renderClientsList(){let el=$('#clientRecords');el.innerHTML=clients.length?`<div class="setting-entries">${clients.map(c=>`<div class="setting-entry"><div><strong>${esc(c.name)}</strong><br><span>${esc(c.company||c.address||'No additional information')} · ${esc(c.phone||'')}</span></div><div class="toolbar"><button class="btn secondary small" data-client-edit="${esc(c.id)}">Edit</button><button class="btn secondary small" data-client-del="${esc(c.id)}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No clients added yet.</div>';el.onclick=async e=>{let edit=e.target.closest('[data-client-edit]'),del=e.target.closest('[data-client-del]');if(edit)editClientForm(clients.find(c=>c.id===edit.dataset.clientEdit));if(del){let c=clients.find(x=>x.id===del.dataset.clientDel);if(await showModal('Delete client?',`Delete ${c.name} from the client directory? Existing quotations will not be affected.`)){await deleteOne('clients',c.id);await refresh();renderClientsList();toast('Client Deleted')}}}}
function editClientForm(c=null){const el=$('#clientEditor');el.classList.remove('hidden');el.innerHTML=`<h3 style="margin-top:0">${c?'Edit':'New'} client</h3><div class="grid2">${['name','company','address','city','country','phone','email'].map(k=>labelField('c_'+k,k[0].toUpperCase()+k.slice(1),c?.[k]||'')).join('')}</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="submitClient">Save Client</button><button class="btn secondary" id="cancelClient">Cancel</button></div>`;$('#cancelClient').onclick=()=>el.classList.add('hidden');$('#submitClient').onclick=async()=>{let data={id:c?.id||uid()};for(let k of ['name','company','address','city','country','phone','email'])data[k]=getText('#c_'+k);if(!data.name)return toast('Enter client name.',true);if(!c&&clients.some(x=>x.name.toLowerCase()===data.name.toLowerCase()))return toast('A client with this name already exists.',true);await putOne('clients',data);await refresh();renderClientsList();el.classList.add('hidden');toast('Client Saved')}}
function renderCustomList(){let el=$('#customList');el.innerHTML=company.fields?.length?`<div class="setting-entries">${company.fields.map(f=>`<div class="setting-entry"><div><strong>${esc(f.label)}</strong><br><span>${esc(f.type)} · ${f.showPDF?'Shows in PDF':'Form only'}</span></div><div class="toolbar"><button class="btn secondary small" data-custom-edit="${esc(f.id)}">Edit</button><button class="btn secondary small" data-custom-del="${esc(f.id)}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No additional fields yet.</div>';el.onclick=async e=>{let ed=e.target.closest('[data-custom-edit]'),del=e.target.closest('[data-custom-del]');if(ed)showCustomEditor(company.fields.find(x=>x.id===ed.dataset.customEdit));if(del){let f=company.fields.find(x=>x.id===del.dataset.customDel);if(await showModal('Delete field?',`Remove ${f.label} from future quotation forms?`)){company.fields=company.fields.filter(x=>x.id!==f.id);await saveCompany();renderCustomList();toast('Custom Field Deleted')}}}}
function showCustomEditor(f=null){$('#customEditor').innerHTML=`<div style="padding:16px;background:#f4f9fc;border:1px solid var(--border);border-radius:13px;margin-bottom:15px"><h3 style="margin-top:0">${f?'Edit':'New'} custom field</h3><div class="grid2">${labelField('cf_label','Field label',f?.label||'') }<div class="field"><label>Field type</label><select id="cf_type">${['text','textarea','number','date','select','checkbox'].map(x=>`<option ${f?.type===x?'selected':''}>${x}</option>`).join('')}</select></div>${labelField('cf_default','Default value',f?.default||'')}${labelField('cf_options','Dropdown options (comma-separated)',f?.options||'')}</div><div class="grid2" style="margin-top:12px"><div class="field"><label>PDF position</label><select id="cf_location"><option value="terms" ${f?.pdfLocation==='terms'?'selected':''}>Terms</option><option value="notes" ${f?.pdfLocation==='notes'?'selected':''}>Notes</option></select></div><div class="field"><label>Required</label><select id="cf_required"><option value="no" ${f?.required?'':'selected'}>Optional</option><option value="yes" ${f?.required?'selected':''}>Required</option></select></div><div class="field"><label>Show in PDF</label><select id="cf_show"><option value="yes" ${f?.showPDF===false?'':'selected'}>Yes</option><option value="no" ${f?.showPDF===false?'selected':''}>No</option></select></div></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="cf_save">Save Field</button><button class="btn secondary" id="cf_cancel">Cancel</button></div></div>`;$('#cf_cancel').onclick=()=>$('#customEditor').innerHTML='';$('#cf_save').onclick=async()=>{let label=getText('#cf_label');if(!label)return toast('Enter a field label.',true);let obj={id:f?.id||uid(),label,type:$('#cf_type').value,default:getText('#cf_default'),options:getText('#cf_options'),pdfLocation:$('#cf_location').value,required:$('#cf_required').value==='yes',showPDF:$('#cf_show').value==='yes'};company.fields=(company.fields||[]).filter(x=>x.id!==obj.id);company.fields.push(obj);await saveCompany();$('#customEditor').innerHTML='';renderCustomList();toast('Custom Field Saved')}}
function createJsonBackup(){return Promise.all([allOf('pdfs'),allOf('quotes'),allOf('clients'),allOf('meta')]).then(async([pdfs,qs,cs,ms])=>{let files=[];for(let p of pdfs){const bytes=new Uint8Array(await p.pdf.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));files.push({id:p.id,quoteId:p.quoteId,ref:p.ref,date:p.date,base64:btoa(binary)})}return{type:'NSNP_BACKUP',version:1,created:new Date().toISOString(),company,quotes:qs,clients:cs,meta:ms,pdfs:files}})}
async function exportBackup(){try{let data=await createJsonBackup(),json=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(json),a=document.createElement('a');a.href=u;a.download=`NSNP_Backup_${mvDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Backup Exported')}catch(e){toast('Backup failed: '+e.message,true)}}
async function importBackup(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.type!=='NSNP_BACKUP'||!Array.isArray(data.quotes)||!Array.isArray(data.clients)||!Array.isArray(data.pdfs)||!data.company)throw Error('Not a valid NSNP backup file');if(!await showModal('Restore NSNP backup?',`Replace current quotations (${quotes.length}), clients, settings and PDFs with the backup data?`,'Restore'))return;let tx=fallback?null:db.transaction(['quotes','clients','settings','meta','pdfs'],'readwrite');if(fallback)localStorage.removeItem(FALLBACK_KEY);else for(let store of ['quotes','clients','settings','meta','pdfs'])tx.objectStore(store).clear();for(let q of data.quotes){if(fallback)await putOne('quotes',q);else tx.objectStore('quotes').put(q)}for(let c of data.clients){if(fallback)await putOne('clients',c);else tx.objectStore('clients').put(c)}if(fallback)await putOne('settings',{key:'main',data:data.company});else tx.objectStore('settings').put({key:'main',data:data.company});for(let m of data.meta||[]){if(fallback)await putOne('meta',m);else tx.objectStore('meta').put(m)}for(let p of data.pdfs){let bytes=binaryFromDataUrl('data:application/pdf;base64,'+p.base64),row={id:p.id,quoteId:p.quoteId,ref:p.ref,date:p.date,pdf:new Blob([bytes],{type:'application/pdf'})};if(fallback)await putOne('pdfs',row);else tx.objectStore('pdfs').put(row)}if(!fallback)await txDone(tx);company={...DEFAULT_COMPANY,...data.company};await refresh();renderSettings();toast('Data Imported Successfully')}catch(err){console.error(err);toast('Restore failed: '+err.message,true)}finally{e.target.value=''}}
window.addEventListener('error',e=>console.error('NSNP error:',e.error));init();
</script>
</body></html>
